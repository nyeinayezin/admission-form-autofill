<!DOCTYPE html>
<html>
<head>
    <title>Admission Form</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>Admission Application</h1>
    <div class="form-container">
    <h1>Student Admission Form</h1>
    <form method="POST" action="/save">
        <div class="form-group">
            <label for="first_name">First Name:</label>
            <input type="text" id="first_name" name="first_name" required>
        </div>
        <div class="form-group">
            <label for="last_name">Last Name:</label>
            <input type="text" id="last_name" name="last_name" required>
        </div>

        <div class="form-group">
            <label for="date_of_birth">Date of Birth:</label>
            <input type="date" id="date_of_birth" name="date_of_birth" required>
        </div>

        <div class="form-group">
            <label>Gender:</label> 
            <div class="gender-options">
                <label> 
                <input type="radio"  name="gender" value="Male" required>Male
                </label>
                <label>
                <input  type="radio" name="gender" value="Female"> Female
                </label>
            </div>
        </div>
        <div><h2>Fill Guardian's Information</h2></div>
        <div class="container">
            <div class="column">
            <!-- Guardian 1 -->
            <h2>Guardian 1</h2>
                <label for="guardian1_first_name">First Name:</label> 
                <input type="text" id="guardian1_first_name" name="guardian1_first_name">
                <br><br>
                <label for="guardian1_last_name">Last Name:</label>
                <input type="text" id="guardian1_last_name" name="guardian1_last_name">
                <br><br>
                <label for="relationship">Relationship to child:</label>
                <input type="text" id="guardian1_relationship" name="guardian1_relationship">
                <br><br>
                <label for="guardian1_phone">Phone:</label>
                <input type="tel" id="guardian1_phone" name="guardian1_phone">
                <br><br>
                <label>Choose for emergency contact</label>
                <label><input type="radio"  name="primary_contact" value="guardian1" required>Guardian 1</label>
                <br><br>
                <label for="guardian1_email">Email:</label>
                <input type="email" id="guardian1_email" name="guardian1_email">
                <br><br>
                <label for="guardian1_address">Address:</label>
                <input type="text" id="guardian1_address" name="guardian1_address">
            </div>
            <br><br>
            <div class="column">
                <!-- Guardian 2 -->
                <h2>Guardian 2</h2>
                
                <label for="guardian2_first_name">First Name:</label>
                <input type="text" id="guardian2_first_name" name="guardian2_first_name">
                <br><br>
                <label for="guardian2_last_name">Last Name:</label>
                <input type="text" id="guardian2_last_name" name="guardian2_last_name">
                <br><br>
                <label for="relationship">Relationship to child:</label>
                <input type="text" id="guardian2_relationship" name="guardian2_relationship">
                <br><br>
                <label for="guardian2_phone">Phone:</label>
                <input type="tel" id="guardian2_phone" name="guardian2_phone">
                <br><br>
                <br>
                <label><input type="radio"  name="primary_contact" value="guardian2">Guardian 2</label>
                <br><br>
                <label for="guardian2_email">Email:</label>
                <input type="email" id="guardian2_email" name="guardian2_email">
                <br><br>
                <label for="guardian2_address">Address:</label>
                <input type="text" id="guardian2_address" name="guardian2_address">
            </div>
        <br><br>    
    </div>
    <div class="container"> 
            <div class = "column">
            <button type="submit" class="submit-button">Submit</button>
            </div>
            <div class="column">
            <button type="reset" class="reset-button">Reset</button>
            </div>
        </div>
    </form>
    </div>



</body>
</html>
